<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORPHEUS · your song becomes a world</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M2 26 L11 8 L17 19 L22 12 L30 26 Z' fill='%238ab4ff'/></svg>">
<style>
  :root{
    --ink:#e9edf6; --dim:#8f9bb3; --faint:#5a6478;
    --accent:#8ab4ff; --accent2:#ffb46b;
    --bg:#05060c; --panel:rgba(13,16,28,.72);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block}
  .overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:0; z-index:10; transition:opacity .6s ease, visibility .6s;
    background:radial-gradient(120% 90% at 50% 12%, rgba(20,26,52,.55), rgba(5,6,12,.92) 70%)}
  .overlay.hidden{opacity:0; visibility:hidden; pointer-events:none}
  .brand{font-size:clamp(34px,6vw,64px); font-weight:200; letter-spacing:.42em; text-indent:.42em;
    background:linear-gradient(180deg,#fff,#9db4e8 70%,#5d78b8); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; user-select:none}
  .tag{margin-top:10px; color:var(--dim); font-weight:300; font-size:clamp(13px,1.6vw,16px); letter-spacing:.18em; text-transform:lowercase}
  .tag b{color:var(--ink); font-weight:400}
  #dropzone{margin-top:44px; width:min(560px,86vw); padding:44px 30px; text-align:center; cursor:pointer;
    border:1px dashed rgba(138,180,255,.35); border-radius:16px; background:rgba(15,20,38,.35);
    transition:border-color .25s, background .25s, transform .25s}
  #dropzone:hover, #dropzone.drag{border-color:rgba(138,180,255,.9); background:rgba(24,32,60,.5); transform:translateY(-2px)}
  #dropzone .big{font-size:17px; font-weight:400; letter-spacing:.02em}
  #dropzone .sub{margin-top:8px; color:var(--faint); font-size:13px}
  #dropzone kbd{border:1px solid #39415c; border-bottom-width:2px; border-radius:5px; padding:1px 7px; font-size:12px; color:var(--dim)}
  #demoBtn{margin-top:18px; background:none; border:none; color:var(--faint); font-size:13px; cursor:pointer;
    letter-spacing:.05em; text-decoration:underline dotted rgba(143,155,179,.5); text-underline-offset:4px}
  #demoBtn:hover{color:var(--accent)}
  #fileInput{display:none}
  /* analysis stage */
  #surveyWrap{display:none; width:min(760px,92vw); flex-direction:column; align-items:center}
  #surveyWrap.active{display:flex}
  #surveyTitle{color:var(--dim); font-size:13px; letter-spacing:.28em; text-transform:uppercase; margin-bottom:18px}
  #surveyTitle b{color:var(--ink); font-weight:500; letter-spacing:.06em; text-transform:none}
  #survey{width:100%; height:170px; border-radius:10px; background:rgba(10,13,25,.6);
    box-shadow:inset 0 0 0 1px rgba(138,180,255,.12)}
  #surveyMeta{display:flex; gap:34px; margin-top:16px; color:var(--faint); font-size:12px; letter-spacing:.14em; text-transform:uppercase}
  #surveyMeta span b{color:var(--accent); font-weight:500}
  #beginBtn{margin-top:30px; padding:14px 58px; font-size:15px; letter-spacing:.34em; text-indent:.34em; text-transform:uppercase;
    color:#0b0e18; background:linear-gradient(180deg,#cfe0ff,#8ab4ff); border:none; border-radius:999px; cursor:pointer;
    opacity:0; transform:translateY(8px); transition:opacity .5s, transform .5s, box-shadow .3s; pointer-events:none}
  #beginBtn.ready{opacity:1; transform:none; pointer-events:auto}
  #beginBtn:hover{box-shadow:0 0 34px rgba(138,180,255,.45)}
  #differentBtn{margin-top:16px; background:none; border:none; color:var(--faint); font-size:12.5px;
    cursor:pointer; letter-spacing:.06em; opacity:0; transition:opacity .5s; pointer-events:none}
  #beginBtn.ready ~ #differentBtn{opacity:.85; pointer-events:auto}
  #differentBtn:hover{color:var(--accent)}
  @media (pointer:coarse){ #hint{display:none} }
  @media (max-width:640px){
    #surveyMeta{flex-wrap:wrap; gap:12px 20px; justify-content:center}
  }
  /* HUD */
  #hud{position:fixed; left:0; right:0; bottom:0; z-index:5; padding:10px 14px 12px;
    display:flex; flex-direction:column; gap:8px; opacity:0; transition:opacity .5s; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(4,5,10,.82) 55%)}
  #hud.on{opacity:1; pointer-events:auto}
  #hud.faded{opacity:0; pointer-events:none}
  #map{width:100%; height:56px; border-radius:8px; cursor:crosshair; display:block;
    box-shadow:inset 0 0 0 1px rgba(138,180,255,.14)}
  #bar{display:flex; align-items:center; gap:14px; font-size:12.5px; color:var(--dim)}
  #bar button{background:rgba(20,26,48,.8); color:var(--ink); border:1px solid rgba(138,180,255,.22);
    border-radius:8px; padding:6px 12px; font-size:12.5px; cursor:pointer; letter-spacing:.04em}
  #bar button:hover{border-color:rgba(138,180,255,.65)}
  #trackName{color:var(--ink); font-weight:500; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #stats{margin-left:auto; display:flex; gap:18px; letter-spacing:.08em}
  #stats b{color:var(--accent); font-weight:500}
  /* end overlay */
  #endCard{display:none; flex-direction:column; align-items:center}
  #endCard.active{display:flex}
  #portrait{width:min(820px,92vw); border-radius:12px; box-shadow:0 24px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(138,180,255,.18)}
  #endBtns{display:flex; gap:14px; margin-top:22px}
  #endBtns button{padding:11px 26px; border-radius:999px; border:1px solid rgba(138,180,255,.35);
    background:rgba(18,24,44,.85); color:var(--ink); font-size:13.5px; letter-spacing:.1em; cursor:pointer}
  #endBtns button:hover{border-color:var(--accent)}
  #endBtns .primary{background:linear-gradient(180deg,#cfe0ff,#8ab4ff); color:#0b0e18; border:none; font-weight:600}
  #toast{position:fixed; top:22px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:40;
    background:rgba(40,16,22,.92); color:#ffd9de; border:1px solid rgba(255,120,140,.4); padding:10px 20px;
    border-radius:10px; font-size:13.5px; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; max-width:80vw}
  #toast.info{background:rgba(14,22,44,.92); color:#d7e4ff; border-color:rgba(138,180,255,.4)}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #hint{position:fixed; top:16px; right:18px; z-index:6; color:var(--faint); font-size:11.5px; letter-spacing:.12em;
    opacity:0; transition:opacity .6s; text-transform:uppercase}
  #hint.on{opacity:.8}
  #nogl{display:none; max-width:520px; text-align:center; line-height:1.7; color:var(--dim); padding:0 20px}
  @media (max-width:640px){ #stats{display:none} #trackName{max-width:40vw} }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="overlay" id="landing">
  <div id="introStage" style="display:flex;flex-direction:column;align-items:center">
    <div class="brand">ORPHEUS</div>
    <div class="tag">your song becomes a <b>world</b> · fly through it</div>
    <div id="dropzone" role="button" tabindex="0" aria-label="Choose an audio file to visualise">
      <div class="big">Drop an audio file — or click to choose</div>
      <div class="sub">mp3 · wav · ogg · flac · m4a &nbsp;·&nbsp; analysed locally, nothing uploaded</div>
    </div>
    <button id="demoBtn">no file handy? conjure a demo track</button>
    <input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.aac,.opus,.webm">
    <div id="nogl"></div>
  </div>
  <div id="surveyWrap">
    <div id="surveyTitle">surveying <b id="surveyName"></b></div>
    <canvas id="survey"></canvas>
    <div id="surveyMeta">
      <span>tempo <b id="mBpm">—</b></span>
      <span>key <b id="mKey">—</b></span>
      <span>sections <b id="mSec">—</b></span>
      <span>beats <b id="mBeats">—</b></span>
      <span>length <b id="mDur">—</b></span>
    </div>
    <button id="beginBtn">Begin</button>
    <button id="differentBtn" type="button">↩ different song</button>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div id="endCard">
    <canvas id="portrait" width="1680" height="945"></canvas>
    <div id="endBtns">
      <button class="primary" id="saveBtn">Save song portrait</button>
      <button id="replayBtn">Travel again</button>
      <button id="newBtn">New song</button>
    </div>
  </div>
</div>

<div id="hud">
  <canvas id="map"></canvas>
  <div id="bar">
    <button id="playBtn">Pause</button>
    <span id="trackName"></span>
    <span id="timeLbl">0:00 / 0:00</span>
    <div id="stats">
      <span>tempo <b id="sBpm">—</b></span>
      <span>key <b id="sKey">—</b></span>
      <span><b id="sFps">—</b> fps</span>
    </div>
    <button id="fsBtn">Fullscreen</button>
  </div>
</div>
<div id="hint">space pause · ←→ seek · f fullscreen</div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   §0 GLOBAL ERROR LEDGER + DEBUG HOOK (read by test harness)
   ============================================================ */
const DEBUG = { errors: [], state: 'landing', fps: 0, renderScale: 1 };
window.addEventListener('error', e => DEBUG.errors.push(String(e.message)));
window.addEventListener('unhandledrejection', e => DEBUG.errors.push('rejection: ' + String(e.reason)));
window.__vizDebug = () => ({
  state: DEBUG.state, fps: Math.round(DEBUG.fps), renderScale: +DEBUG.renderScale.toFixed(2),
  t: APP.playT(), dur: APP.brain ? +APP.brain.duration.toFixed(2) : 0,
  bpm: APP.brain ? +APP.brain.bpm.toFixed(1) : 0,
  beats: APP.brain ? APP.brain.beats.length : 0,
  sections: APP.brain ? APP.brain.sections.length : 0,
  gatesPassed: APP.gatesPassed | 0,
  errors: DEBUG.errors.slice(0, 12),
});

/* ============================================================
   §1 AUDIOBRAIN — offline musical-structure analysis (pure JS)
   Verified against a ground-truth synthetic song in Node.
   ============================================================ */
const AudioBrain = (() => {

  function makeFFT(n) {
    const levels = Math.log2(n) | 0;
    const cosT = new Float32Array(n / 2), sinT = new Float32Array(n / 2);
    for (let i = 0; i < n / 2; i++) {
      cosT[i] = Math.cos(2 * Math.PI * i / n);
      sinT[i] = Math.sin(2 * Math.PI * i / n);
    }
    const rev = new Uint32Array(n);
    for (let i = 0; i < n; i++) {
      let x = i, r = 0;
      for (let j = 0; j < levels; j++) { r = (r << 1) | (x & 1); x >>= 1; }
      rev[i] = r;
    }
    return function fft(re, im) {
      for (let i = 0; i < n; i++) {
        const j = rev[i];
        if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
      }
      for (let size = 2; size <= n; size <<= 1) {
        const half = size >> 1, step = n / size;
        for (let i = 0; i < n; i += size) {
          for (let j = i, k = 0; j < i + half; j++, k += step) {
            const l = j + half;
            const tre = re[l] * cosT[k] + im[l] * sinT[k];
            const tim = im[l] * cosT[k] - re[l] * sinT[k];
            re[l] = re[j] - tre; im[l] = im[j] - tim;
            re[j] += tre; im[j] += tim;
          }
        }
      }
    };
  }

  // left/right: Float32Array; right optional. onProgress(0..1). Async: yields to UI.
  async function analyze(left, right, sr, onProgress) {
    const useHop = left.length / sr > 480 ? 1024 : 512; // keep long files fast
    const N = 2048, HOP = useHop;
    const nFrames = Math.max(1, Math.floor((left.length - N) / HOP) + 1);
    const fps = sr / HOP;
    const fft = makeFFT(N);
    const win = new Float32Array(N);
    for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));

    const nBins = N / 2, binHz = sr / N;
    const BANDS = [20, 60, 150, 400, 1000, 2400, 6000, 16000];
    const bandBin = BANDS.map(hz => Math.min(nBins - 1, Math.max(1, Math.round(hz / binHz))));
    for (let k = 1; k < bandBin.length; k++)          // high sample rates squeeze the low
      bandBin[k] = Math.min(nBins - 1, Math.max(bandBin[k], bandBin[k - 1] + 1)); // bands — keep every band ≥1 bin
    const nBands = BANDS.length - 1;
    // constant DC offset (broken recorders) leaks into the sub band — remove it
    let dcL = 0, dcR = 0;
    for (let i = 0; i < left.length; i += 16) dcL += left[i];
    dcL /= Math.max(1, Math.ceil(left.length / 16));
    if (right) {
      for (let i = 0; i < right.length; i += 16) dcR += right[i];
      dcR /= Math.max(1, Math.ceil(right.length / 16));
    }

    const chromaOf = new Int8Array(nBins).fill(-1);
    for (let b = 1; b < nBins; b++) {
      const hz = b * binHz;
      if (hz < 50 || hz > 5000) continue;
      chromaOf[b] = ((Math.round(69 + 12 * Math.log2(hz / 440)) % 12) + 12) % 12;
    }

    const re = new Float32Array(N), im = new Float32Array(N);
    let prevMag = new Float32Array(nBins), mag = new Float32Array(nBins);
    const rms = new Float32Array(nFrames), flux = new Float32Array(nFrames);
    const centroid = new Float32Array(nFrames), width = new Float32Array(nFrames);
    const bands = new Float32Array(nFrames * nBands), chroma = new Float32Array(nFrames * 12);

    let sliceStart = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    for (let f = 0; f < nFrames; f++) {
      const off = f * HOP;
      let sq = 0, sLL = 0, sRR = 0, sLR = 0;
      for (let i = 0; i < N; i++) {
        const l = (left[off + i] || 0) - dcL;
        const r = right ? (right[off + i] || 0) - dcR : l;
        const m = (l + r) * 0.5;
        re[i] = m * win[i]; im[i] = 0;
        sq += m * m; sLL += l * l; sRR += r * r; sLR += l * r;
      }
      rms[f] = Math.sqrt(sq / N);
      const den = Math.sqrt(sLL * sRR);
      width[f] = den > 1e-9 ? Math.min(1, Math.max(0, 1 - sLR / den)) : 0;
      fft(re, im);
      let fl = 0, cSum = 0, cW = 0;
      for (let b = 1; b < nBins; b++) {
        const m = Math.hypot(re[b], im[b]);
        mag[b] = m;
        const d = m - prevMag[b];
        if (d > 0) fl += d;
        cSum += m * b; cW += m;
        const pc = chromaOf[b];
        if (pc >= 0) chroma[f * 12 + pc] += m * m;
      }
      flux[f] = fl;
      centroid[f] = cW > 1e-9 ? cSum / cW * binHz : 0;
      for (let k = 0; k < nBands; k++) {
        let e = 0;
        for (let b = bandBin[k]; b < bandBin[k + 1]; b++) e += mag[b] * mag[b];
        bands[f * nBands + k] = Math.sqrt(e / Math.max(1, bandBin[k + 1] - bandBin[k]));
      }
      const t = prevMag; prevMag = mag; mag = t;
      if ((f & 31) === 31) {
        const nowT = (typeof performance !== 'undefined' ? performance.now() : Date.now());
        if (nowT - sliceStart > 11) {          // time-based yield keeps the UI at ~60fps
          if (onProgress) onProgress(f / nFrames);
          // MessageChannel yield: unlike setTimeout it isn't clamped in background tabs
          await new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = r; c.port2.postMessage(0); });
          sliceStart = (typeof performance !== 'undefined' ? performance.now() : Date.now());
        }
      }
    }

    for (let f = 0; f < nFrames; f++) {
      let mx = 0;
      for (let k = 0; k < 12; k++) mx = Math.max(mx, chroma[f * 12 + k]);
      if (mx > 0) for (let k = 0; k < 12; k++) chroma[f * 12 + k] /= mx;
    }

    // onset envelope = smoothed flux minus local mean
    const onsetEnv = new Float32Array(nFrames);
    {
      const W = Math.round(fps * 0.7);
      const pre = new Float32Array(nFrames);
      for (let f = 0; f < nFrames; f++) {
        const a = flux[Math.max(0, f - 1)], b = flux[f], c = flux[Math.min(nFrames - 1, f + 1)];
        pre[f] = (a + 2 * b + c) / 4;
      }
      let run = 0;
      for (let f = 0; f < nFrames; f++) {
        run += pre[f];
        if (f >= W) run -= pre[f - W];
        onsetEnv[f] = Math.max(0, pre[f] - run / Math.min(f + 1, W));
      }
    }

    // tempo (autocorrelation, log-gauss prior around 120)
    const minLag = Math.round(60 / 190 * fps), maxLag = Math.round(60 / 60 * fps);
    let bestLag = 0, bestScore = -1, meanScore = 0, nScore = 0;
    for (let lag = minLag; lag <= maxLag; lag++) {
      let s = 0;
      for (let f = lag; f < nFrames; f++) s += onsetEnv[f] * onsetEnv[f - lag];
      const bpmC = 60 * fps / lag;
      s *= Math.exp(-0.5 * Math.pow(Math.log2(bpmC / 120) / 0.9, 2));
      meanScore += s; nScore++;
      if (s > bestScore) { bestScore = s; bestLag = lag; }
    }
    meanScore /= Math.max(1, nScore);
    const beatConfidence = meanScore > 0 ? Math.min(1, (bestScore / meanScore - 1) / 3) : 0;
    const bpm = bestLag > 0 ? 60 * fps / bestLag : 120;

    // beat phase + grid
    let bestPhase = 0, bestPh = -1;
    if (bestLag > 0) for (let p = 0; p < bestLag; p++) {
      let s = 0;
      for (let f = p; f < nFrames; f += bestLag) s += onsetEnv[f];
      if (s > bestPh) { bestPh = s; bestPhase = p; }
    }
    const beats = [];
    if (bestLag > 0) {
      const tol = Math.max(1, Math.round(bestLag * 0.12));
      for (let f = bestPhase; f < nFrames; f += bestLag) {
        let pk = f, pv = -1;
        for (let g = Math.max(0, f - tol); g <= Math.min(nFrames - 1, f + tol); g++)
          if (onsetEnv[g] > pv) { pv = onsetEnv[g]; pk = g; }
        beats.push(pk / fps);
      }
    }
    // is the music actually ON this grid? (drones/ambient trick the autocorrelation)
    let gridRatio = 0;
    const beatStrength = new Float32Array(beats.length);
    if (bestLag > 0 && beats.length) {
      const tol = Math.max(1, Math.round(bestLag * 0.12));
      const peakNear = f0 => {
        let m = 0;
        for (let f = Math.max(0, f0 - tol); f <= Math.min(nFrames - 1, f0 + tol); f++) m = Math.max(m, onsetEnv[f]);
        return m;
      };
      let on = 0, offv = 0, envMax = 1e-9;
      for (let f = 0; f < nFrames; f++) envMax = Math.max(envMax, onsetEnv[f]);
      beats.forEach((t, i) => {
        const f = Math.round(t * fps);
        const pk = peakNear(f);
        beatStrength[i] = Math.min(1, pk / (envMax * 0.5));
        on += pk;
        offv += peakNear(f + Math.round(bestLag / 2));
      });
      gridRatio = on / (offv + 1e-9);
    }
    // downbeat: choose the beat-phase (of 4) with strongest average onset
    let downPhase = 0;
    {
      const acc = [0, 0, 0, 0];
      beats.forEach((t, i) => { acc[i % 4] += onsetEnv[Math.min(nFrames - 1, Math.round(t * fps))]; });
      downPhase = acc.indexOf(Math.max(...acc));
    }

    // onsets
    const onsets = [];
    {
      let mx = 0;
      for (let f = 0; f < nFrames; f++) mx = Math.max(mx, onsetEnv[f]);
      const thr = mx * 0.15, minGap = Math.round(fps * 0.09);
      let last = -minGap;
      for (let f = 1; f < nFrames - 1; f++) {
        if (onsetEnv[f] > thr && onsetEnv[f] >= onsetEnv[f - 1] && onsetEnv[f] > onsetEnv[f + 1] && f - last >= minGap) {
          onsets.push({ t: f / fps, s: Math.min(1, onsetEnv[f] / (mx * 0.6)) });
          last = f;
        }
      }
    }

    // smoothed energy
    const energy = new Float32Array(nFrames);
    {
      const W = Math.max(1, Math.round(fps));
      let run = 0;
      for (let f = 0; f < nFrames; f++) {
        run += rms[f];
        if (f >= W) run -= rms[f - W];
        energy[f] = run / Math.min(f + 1, W);
      }
      let mx = 0;
      for (let f = 0; f < nFrames; f++) mx = Math.max(mx, energy[f]);
      if (mx > 0) for (let f = 0; f < nFrames; f++) energy[f] /= mx;
    }

    // sections via novelty
    const sections = [];
    {
      const SEG = Math.max(1, Math.round(fps * 1.5));
      const nSeg = Math.max(1, Math.floor(nFrames / SEG));
      const dim = nBands + 1;
      const feats = new Float32Array(nSeg * dim);
      for (let s = 0; s < nSeg; s++)
        for (let f = s * SEG; f < (s + 1) * SEG && f < nFrames; f++) {
          for (let k = 0; k < nBands; k++) feats[s * dim + k] += bands[f * nBands + k] / SEG;
          feats[s * dim + nBands] += rms[f] / SEG;
        }
      for (let k = 0; k < dim; k++) {
        let mx = 1e-9;
        for (let s = 0; s < nSeg; s++) mx = Math.max(mx, feats[s * dim + k]);
        for (let s = 0; s < nSeg; s++) feats[s * dim + k] /= mx;
      }
      const nov = new Float32Array(nSeg), K = 2;
      for (let s = K; s < nSeg - K; s++) {
        let d = 0;
        for (let k = 0; k < dim; k++) {
          let a = 0, b = 0;
          for (let j = 1; j <= K; j++) { a += feats[(s - j) * dim + k]; b += feats[(s + j - 1) * dim + k]; }
          const diff = (b - a) / K;
          d += diff * diff;
        }
        nov[s] = Math.sqrt(d);
      }
      let mx = 0;
      for (let s = 0; s < nSeg; s++) mx = Math.max(mx, nov[s]);
      const bounds = [0];
      const minGapSeg = Math.round(4 / 1.5);
      let lastB = -minGapSeg;
      for (let s = 1; s < nSeg - 1; s++)
        if (nov[s] > mx * 0.35 && nov[s] >= nov[s - 1] && nov[s] > nov[s + 1] && s - lastB >= minGapSeg) {
          bounds.push(s); lastB = s;
        }
      bounds.push(nSeg);
      for (let i = 0; i < bounds.length - 1; i++) {
        const f0 = bounds[i] * SEG, f1 = Math.min(nFrames, bounds[i + 1] * SEG);
        let e = 0;
        const fp = new Float32Array(nBands + 12);
        for (let f = f0; f < f1; f++) {
          e += energy[f];
          for (let k = 0; k < nBands; k++) fp[k] += bands[f * nBands + k];
          for (let k = 0; k < 12; k++) fp[nBands + k] += chroma[f * 12 + k];
        }
        const n = Math.max(1, f1 - f0);
        for (let k = 0; k < fp.length; k++) fp[k] /= n;
        const acc = fp.slice(nBands);
        let key = 0;
        for (let k = 1; k < 12; k++) if (acc[k] > acc[key]) key = k;
        sections.push({ t0: f0 / fps, t1: f1 / fps, energy: e / n, fp, key, family: -1 });
      }
      const es = sections.map(s => s.energy);
      const eMin = Math.min(...es), eMax = Math.max(...es);
      sections.forEach(s => { s.intensity = eMax > eMin ? (s.energy - eMin) / (eMax - eMin) : 0.5; });

      // fingerprint matching → families (chorus 2 == chorus 1 geography)
      const fams = [];
      const cos = (a, b) => {
        let d = 0, na = 0, nb = 0;
        for (let k = 0; k < a.length; k++) { d += a[k] * b[k]; na += a[k] * a[k]; nb += b[k] * b[k]; }
        return d / Math.max(1e-9, Math.sqrt(na * nb));
      };
      sections.forEach(s => {
        let best = -1, bestSim = 0.90;
        fams.forEach((f, i) => { const c = cos(s.fp, f); if (c > bestSim) { bestSim = c; best = i; } });
        if (best < 0) { fams.push(s.fp); best = fams.length - 1; }
        s.family = best;
        delete s.fp;
      });
    }

    function pct(arr, p) {
      const a = Array.from(arr).sort((x, y) => x - y);
      return a[Math.min(a.length - 1, Math.floor(p * a.length))] || 0;
    }
    const bandP95 = new Float32Array(nBands);
    for (let k = 0; k < nBands; k++) {
      const col = new Float32Array(nFrames);
      for (let f = 0; f < nFrames; f++) col[f] = bands[f * nBands + k];
      bandP95[k] = Math.max(1e-6, pct(col, 0.95));
    }

    // audio hash → deterministic world seed
    let seed = 2166136261;
    for (let i = 0; i < left.length; i += 1024) {
      seed ^= (left[i] * 32767) | 0;
      seed = Math.imul(seed, 16777619);
    }
    seed = (seed >>> 0) / 4294967295;

    if (onProgress) onProgress(1);
    return {
      sr, fps, nFrames, nBands, bpm, beatConfidence, downPhase, gridRatio, beatStrength,
      beats, onsets, sections, seed,
      rms, flux, centroid, energy, bands, chroma, width,
      bandP95, fluxP95: Math.max(1e-6, pct(flux, 0.95)), rmsP95: Math.max(1e-6, pct(rms, 0.95)),
      duration: left.length / sr,
    };
  }

  return { analyze, makeFFT };
})();

/* ============================================================
   §2 WEBGL HELPERS
   ============================================================ */
const GLH = (() => {
  function compile(gl, type, src, tag) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      DEBUG.errors.push(`shader ${tag}: ${log}`);
      console.error(tag, log);
    }
    return sh;
  }
  function program(gl, vs, fs, tag) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs, tag + '.vs'));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs, tag + '.fs'));
    // pin attribute locations (harmless no-ops for names a program lacks)
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.bindAttribLocation(p, 0, 'aGrid');
    gl.bindAttribLocation(p, 0, 'aQuad');
    gl.bindAttribLocation(p, 1, 'aInst');
    gl.bindAttribLocation(p, 1, 'aSeed');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      DEBUG.errors.push(`link ${tag}: ${gl.getProgramInfoLog(p)}`);
    }
    const uni = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      uni[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name);
    }
    return { prog: p, u: uni };
  }
  function fbo(gl, w, h, hdr) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, hdr ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    let depth = null;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, tex, w, h,
      attachDepth() {
        depth = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return this;
      },
      dispose() {
        gl.deleteFramebuffer(fb); gl.deleteTexture(tex);
        if (depth) gl.deleteRenderbuffer(depth);
      } };
  }
  // matrices (column-major)
  function perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
  }
  function lookAt(eye, at, up) {
    let zx = eye[0] - at[0], zy = eye[1] - at[1], zz = eye[2] - at[2];
    let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([
      xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1]);
  }
  function mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  }
  return { program, fbo, perspective, lookAt, mul };
})();

/* ============================================================
   §3 SHADERS
   ============================================================ */
const SHADERS = (() => {
  const NOISE = `
  float hash1(float n){ return fract(sin(n)*43758.5453123); }
  float hash2(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  // periodic value noise: lattice wraps at P so world coords can be wrapped
  // into a bounded domain first — float32 stays precise however long the song is
  float vnoiseP(vec2 p, float P){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    float a=hash2(mod(i,P)), b=hash2(mod(i+vec2(1,0),P)),
          c=hash2(mod(i+vec2(0,1),P)), d=hash2(mod(i+vec2(1,1),P));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
  }
  float vnoise(vec2 p){ return vnoiseP(p, 512.); }
  float fbm(vec2 p){
    p = mod(p, 512.);
    float v=0., a=.5, P=512.;
    for(int i=0;i<4;i++){ v+=a*vnoiseP(p,P); p*=2.; P*=2.; a*=.5; }
    return v;
  }
  vec3 hsl2rgb(float h, float s, float l){
    vec3 rgb = clamp(abs(mod(h*6.+vec3(0.,4.,2.),6.)-3.)-1., 0., 1.);
    return l + s*(rgb-.5)*(1.-abs(2.*l-1.));
  }`;

  const ROAD = `
  uniform vec3 uRoad1; // A, w, phase
  uniform vec3 uRoad2;
  float roadX(float s){
    return uRoad1.x*sin(s*uRoad1.y+uRoad1.z) + uRoad2.x*sin(s*uRoad2.y+uRoad2.z);
  }`;

  const TIMELINE = `
  uniform sampler2D uTimeline;   // row0: macro, valleyW, energy, brightness | row1: hue, sectIntensity, onsetDensity, stereoW
  uniform float uTotalLen;
  vec4 tl0(float s){ return texture(uTimeline, vec2(clamp(s/uTotalLen, 0., 1.), .25)); }
  vec4 tl1(float s){ return texture(uTimeline, vec2(clamp(s/uTotalLen, 0., 1.), .75)); }`;

  const terrainVS = `#version 300 es
  precision highp float;
  in vec2 aGrid;                  // x: -1..1 lateral, y: 0..1 depth
  uniform mat4 uProj, uView;
  uniform float uCamS;
  uniform sampler2D uLiveFFT;
  uniform float uLivePresence;
  ${NOISE} ${ROAD} ${TIMELINE}
  out vec3 vWp;
  out float vU;
  out float vWall;      // 0 floor .. 1 wall
  out float vLive;
  out float vRoadD;     // lateral distance from the road centreline
  float terrainH(float x, float z, float vw, float macro, out float wallT){
    float d = abs(x - roadX(z));
    float t = smoothstep(vw*.32, vw, d);
    wallT = t;
    float h = t * (6. + 96.*macro) * (.55 + .45*fbm(vec2(x*.045, z*.045)));
    h += t * 7.5 * fbm(vec2(x*.16, z*.16));
    h += (1.-t) * .6 * fbm(vec2(x*.5, z*.5));
    return h;
  }
  void main(){
    float depth = pow(aGrid.y, 2.1);
    float z = uCamS - 26. + depth * 950.;
    float u = clamp(z/uTotalLen, 0., 1.);
    vec4 t0 = tl0(z);
    float macro = t0.r;
    float vw = mix(11., 46., t0.g);
    float halfSpan = 34. + (z - uCamS + 26.) * .62;
    float x = roadX(z) + aGrid.x * halfSpan;
    float wallT;
    float h = terrainH(x, z, vw, macro, wallT);
    // present trembles: the near-field floor is a live spectrum (bass centre, treble edges)
    float rel = clamp(abs(x - roadX(z))/max(vw,1.), 0., 1.);
    float live = texture(uLiveFFT, vec2(rel*.9+.05, .5)).r;
    float prox = exp(-abs(z - uCamS - 14.)/34.);
    float tremble = (1.-wallT) * live*live * 2.2 * prox * uLivePresence;
    h += tremble;
    vLive = tremble;
    vWp = vec3(x, h, z);
    vU = u;
    vWall = wallT;
    vRoadD = x - roadX(z);
    gl_Position = uProj * uView * vec4(vWp, 1.);
  }`;

  const terrainFS = `#version 300 es
  precision highp float;
  in vec3 vWp;
  in float vU;
  in float vWall;
  in float vLive;
  in float vRoadD;
  uniform vec3 uEye;
  uniform vec4 uLive;        // bass mid treble energy
  uniform float uDropFlash;
  uniform vec3 uSkyHorizon;
  uniform float uFogK;
  ${NOISE} ${TIMELINE}
  out vec4 frag;
  void main(){
    vec3 dx = dFdx(vWp), dy = dFdy(vWp);
    vec3 n = normalize(cross(dx, dy));
    if (n.y < 0.) n = -n;
    vec4 t0 = texture(uTimeline, vec2(vU, .25));
    vec4 t1 = texture(uTimeline, vec2(vU, .75));
    float bright = t0.a;             // spectral centroid 0..1
    float hue = t1.r;
    // biome: cold obsidian ↔ warm bone by brightness
    vec3 coldLo = vec3(.045,.05,.10), coldHi = vec3(.30,.36,.52);
    vec3 warmLo = vec3(.16,.11,.09),  warmHi = vec3(.87,.78,.62);
    vec3 lo = mix(coldLo, warmLo, bright), hi = mix(coldHi, warmHi, bright);
    float shade = clamp(dot(n, normalize(vec3(.35,.8,-.42)))*.5+.5, 0., 1.);
    vec3 alb = mix(lo, hi, shade);
    // floor: darker, with a thin glowing path line along the road itself
    float roadGlow = exp(-pow(vRoadD*.85, 2.)) * (1.-vWall);
    alb = mix(alb*.40, alb, vWall);
    // strata seams — the song's timbral history carved into rock
    float band = fract(vWp.y*.20 + hue*4.0);
    float seam = smoothstep(.035,.0,abs(band-.5)) * vWall;
    vec3 seamCol = hsl2rgb(hue, .85, .60);
    float seamAmp = (.12 + .5*t1.b) * (.25 + .8*uLive.x);
    // present-tense glow on the trembling floor spectrum
    vec3 liveCol = hsl2rgb(fract(hue+.08), .9, .62);
    vec3 emis = seamCol * seam * seamAmp * 1.4
              + liveCol * vLive * .16
              + hsl2rgb(hue,.8,.65) * roadGlow * (.14+.22*uLive.w);
    float dist = length(vWp - uEye);
    vec3 col = alb * (.35 + .75*shade) + emis * exp(-dist*uFogK*1.6);
    col += vec3(1.,.97,.9) * uDropFlash * .22;
    float fog = 1.-exp(-dist*uFogK);
    col = mix(col, uSkyHorizon, fog);
    frag = vec4(col, 1.);
  }`;

  const skyVS = `#version 300 es
  precision highp float;
  in vec2 aPos;
  uniform mat4 uInvVP;
  out vec3 vDir;
  void main(){
    vec4 a = uInvVP * vec4(aPos, .999, 1.);
    vec4 b = uInvVP * vec4(aPos, .0, 1.);
    vDir = a.xyz/a.w - b.xyz/b.w;
    gl_Position = vec4(aPos, .9999, 1.);
  }`;

  const skyFS = `#version 300 es
  precision highp float;
  in vec3 vDir;
  uniform vec3 uSkyTop, uSkyHorizon;
  uniform float uAhead;         // upcoming energy → the future glows on the horizon
  uniform float uHue;
  uniform vec4 uLive;
  uniform float uTime;
  uniform float uStarAmt;
  ${NOISE}
  out vec4 frag;
  void main(){
    vec3 d = normalize(vDir);
    float h = clamp(d.y, -.05, 1.);
    vec3 col = mix(uSkyHorizon, uSkyTop, pow(clamp(h*1.5,0.,1.), .75));
    // stars — round points, gentle twinkle
    vec2 sp = d.xz/(.18+d.y)*1.8;
    vec2 cell = floor(sp*30.);
    vec2 fc = fract(sp*30.)-.5;
    float st = pow(hash2(cell), 90.) * exp(-dot(fc,fc)*22.) * smoothstep(.03,.25,d.y);
    col += vec3(.9,.95,1.) * st * uStarAmt * (0.7+0.3*sin(uTime*1.1+hash2(cell)*40.));
    // aurora — harmony made weather
    float aw = fbm(vec2(d.x*2.2+uTime*.05, d.y*2.4-uTime*.03));
    for (int i=0;i<3;i++){
      float fi = float(i);
      float y0 = .24+fi*.16 + aw*.22;
      float bandV = exp(-pow((d.y-y0)*7.,2.)) * (.06+.30*uLive.y);
      col += hsl2rgb(fract(uHue + fi*.09), .8, .55) * bandV * smoothstep(.05,.3,d.y);
    }
    // the approaching future: horizon bloom ahead in direction of travel (+z)
    float fwd = pow(max(d.z,0.),7.)*exp(-abs(d.y)*9.);
    col += hsl2rgb(fract(uHue+.04),.75,.62) * fwd * (0.25 + 2.2*uAhead);
    // moon
    float moon = smoothstep(.012,.008, distance(d.xy/(.001+abs(d.z)+1.)*vec2(1.,1.), vec2(-.34,.31)) );
    col += vec3(.8,.86,1.)*moon*.0; // subtle off — kept for future
    frag = vec4(col,1.);
  }`;

  const gateVS = `#version 300 es
  precision highp float;
  in vec2 aQuad;                 // -1..1
  in vec4 aInst;                 // s, strength, isDown, hue
  uniform mat4 uProj, uView;
  uniform vec3 uCamRight, uCamUp;
  uniform float uCamS, uPulseS, uPulseAmt;
  ${ROAD} ${TIMELINE}
  out vec2 vUv;
  out vec4 vInst;
  out float vPulse;
  out float vFade;
  void main(){
    float s = aInst.x;
    float rel = s - uCamS;
    float vis = step(-10., rel) * step(rel, 330.);
    float size = (4.4 + 3.4*aInst.y) * (aInst.z > .5 ? 1.4 : 1.);
    float pulse = uPulseAmt * exp(-abs(s-uPulseS)*.6);
    size *= 1. + pulse*.3;
    // the camera flies at y≈3.4 — gates are threaded, not flown under
    vec3 center = vec3(roadX(s), 3.4, s);
    vec3 wp = center + (uCamRight*aQuad.x + uCamUp*aQuad.y) * size * vis;
    vUv = aQuad;
    vInst = aInst;
    vPulse = pulse;
    vFade = exp(-max(0., rel - 26.)/110.) * smoothstep(-10., -2., rel);
    gl_Position = uProj * uView * vec4(wp, 1.);
  }`;

  const gateFS = `#version 300 es
  precision highp float;
  in vec2 vUv;
  in vec4 vInst;
  in float vPulse;
  in float vFade;
  uniform vec4 uLive;
  ${NOISE}
  out vec4 frag;
  void main(){
    float r = length(vUv);
    float ring = smoothstep(.07,.015,abs(r-.76));
    float inner = smoothstep(.76,.0,r)*.05;
    float tick = 0.;
    if (vInst.z > .5) { // downbeat gates get cardinal ticks
      vec2 a = abs(vUv);
      tick = smoothstep(.04,.012,min(a.x,a.y)) * smoothstep(.98,.82,r) * step(.7,r);
    }
    vec3 col = hsl2rgb(vInst.w, .8, .6);
    float amp = (.4 + .5*vInst.y) * (1. + vPulse*2.6) + uLive.x*.15;
    amp *= vFade;
    vec3 c = col * (ring*1.5 + tick*1.1 + inner) * amp;
    frag = vec4(c, (ring+tick+inner)*amp);
  }`;

  const monoVS = `#version 300 es
  precision highp float;
  in vec2 aQuad;
  in vec4 aInst;             // s, intensity, hue, kind
  uniform mat4 uProj, uView;
  uniform vec3 uCamRight;
  uniform float uCamS;
  ${ROAD} ${TIMELINE}
  out vec2 vUv;
  out vec4 vInst;
  void main(){
    float s = aInst.x;
    float rel = s - uCamS;
    float vis = step(2., rel) * step(rel, 1200.);
    float hgt = 50. + 190.*aInst.y;
    float wid = 5. + 9.*aInst.y;
    vec3 center = vec3(roadX(s), hgt*.5 - 2., s);
    vec3 wp = center + uCamRight*aQuad.x*wid*vis + vec3(0., aQuad.y*hgt*.5*vis, 0.);
    vUv = aQuad;
    vInst = aInst;
    gl_Position = uProj * uView * vec4(wp, 1.);
  }`;

  const monoFS = `#version 300 es
  precision highp float;
  in vec2 vUv;
  in vec4 vInst;
  uniform float uTime;
  ${NOISE}
  out vec4 frag;
  void main(){
    float core = exp(-pow(vUv.x*3.4, 2.));
    float halo = exp(-pow(vUv.x*1.25, 2.))*.4;
    float flick = .82 + .18*sin(uTime*7. + vUv.y*20.);
    float vgrad = smoothstep(-1.05, -.2, vUv.y) * (1.-.25*vUv.y);
    vec3 col = hsl2rgb(vInst.z, .75, .68);
    vec3 c = col * (core*1.9 + halo) * flick * vgrad * (.5 + .9*vInst.y);
    frag = vec4(c, core*vgrad);
  }`;

  const partVS = `#version 300 es
  precision highp float;
  in vec2 aQuad;
  in float aSeed;
  uniform mat4 uProj, uView;
  uniform vec3 uCamRight, uCamUp;
  uniform float uCamS, uTime;
  uniform vec4 uLive;
  ${NOISE} ${ROAD} ${TIMELINE}
  out vec2 vUv;
  out float vTw;
  out float vHue;
  void main(){
    float h1=hash1(aSeed*7.1), h2=hash1(aSeed*13.7), h3=hash1(aSeed*29.3),
          h4=hash1(aSeed*41.9), h5=hash1(aSeed*57.7), h6=hash1(aSeed*71.3);
    float drift = 2.5 + 20.*h2*(0.3+uLive.w);
    float sp = uCamS + mod(h1*1500. + uTime*drift, 380.) - 30.;
    vec4 t0 = tl0(sp);
    float vw = mix(11., 46., t0.g);
    float ang = h3*6.28318 + uTime*(.08+.3*h4);
    float rad = mix(1.5, vw*1.15, h5);
    float y = .9 + h6*h6*h6*(5. + 26.*t0.r) + sin(uTime*(.4+h4)+h1*40.)*.9;
    vec3 center = vec3(roadX(sp) + cos(ang)*rad, y, sp);
    float tw = .40 + .38*sin(uTime*(1.6+4.*h4) + h1*80.);
    tw *= 1. + uLive.z*1.6*step(.8, h6);       // treble makes the bright ones spark
    float size = mix(.07, .3, h2) * (1.+.8*uLive.z*step(.8,h6));
    vec3 wp = center + (uCamRight*aQuad.x + uCamUp*aQuad.y)*size;
    vUv = aQuad; vTw = tw;
    vHue = tl1(sp).r;
    gl_Position = uProj * uView * vec4(wp, 1.);
  }`;

  const partFS = `#version 300 es
  precision highp float;
  in vec2 vUv;
  in float vTw;
  in float vHue;
  ${NOISE}
  out vec4 frag;
  void main(){
    float r = length(vUv);
    float d = exp(-r*r*5.);
    vec3 col = mix(hsl2rgb(vHue,.75,.7), vec3(1.), .45);
    frag = vec4(col*d*vTw*.55, d*vTw*.4);
  }`;

  const quadVS = `#version 300 es
  precision highp float;
  in vec2 aPos;
  out vec2 vUv;
  void main(){ vUv = aPos*.5+.5; gl_Position = vec4(aPos,0.,1.); }`;

  const brightFS = `#version 300 es
  precision highp float;
  in vec2 vUv;
  uniform sampler2D uTex;
  uniform vec2 uThresh;      // HDR: (.95,1.7) — LDR fallback: lower so bloom still exists
  out vec4 frag;
  void main(){
    vec3 c = texture(uTex, vUv).rgb;
    float l = dot(c, vec3(.299,.587,.114));
    frag = vec4(c * smoothstep(uThresh.x, uThresh.y, l), 1.);
  }`;

  const blurFS = `#version 300 es
  precision highp float;
  in vec2 vUv;
  uniform sampler2D uTex;
  uniform vec2 uDir;
  out vec4 frag;
  void main(){
    vec3 c = texture(uTex, vUv).rgb * .227;
    vec2 o1 = uDir*1.384, o2 = uDir*3.230;
    c += (texture(uTex, vUv+o1).rgb + texture(uTex, vUv-o1).rgb)*.316;
    c += (texture(uTex, vUv+o2).rgb + texture(uTex, vUv-o2).rgb)*.070;
    frag = vec4(c,1.);
  }`;

  const compositeFS = `#version 300 es
  precision highp float;
  in vec2 vUv;
  uniform sampler2D uScene, uBloom;
  uniform float uBeatPulse, uDropFlash, uTime, uEnergy, uVigStr;
  out vec4 frag;
  vec3 aces(vec3 x){
    return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.);
  }
  void main(){
    float ca = uBeatPulse*.0035 + uDropFlash*.008;
    vec2 cdir = (vUv-.5)*ca;
    vec3 c;
    c.r = texture(uScene, vUv+cdir).r;
    c.g = texture(uScene, vUv).g;
    c.b = texture(uScene, vUv-cdir).b;
    vec3 bloom = texture(uBloom, vUv).rgb;
    c += bloom * (.4 + .3*uEnergy + uDropFlash*.5);
    c += vec3(1.,.96,.88)*uDropFlash*.18;
    c = aces(c * (1. + uBeatPulse*.06));
    float r2 = dot(vUv-.5, vUv-.5);
    c *= 1. - uVigStr*r2*1.35;
    float g = fract(sin(dot(vUv*vec2(1234.5,761.3), vec2(12.9898,78.233))+uTime*61.)*43758.55);
    c += (g-.5)*.015;
    frag = vec4(c, 1.);
  }`;

  return { terrainVS, terrainFS, skyVS, skyFS, gateVS, gateFS, monoVS, monoFS, partVS, partFS, quadVS, brightFS, blurFS, compositeFS };
})();

const APP = {
  state: 'landing',
  brain: null,
  fileName: '',
  audioBuf: null,
  actx: null, source: null, analyser: null, gainNode: null,
  startCtxTime: 0, startOffset: 0, sourceGen: 0,
  gatesPassed: 0,

  playT() {
    if (!this.actx || !this.brain) return 0;
    if (this.state === 'playing')
      return Math.min(this.brain.duration, this.actx.currentTime - this.startCtxTime + this.startOffset);
    return this.startOffset;
  },
};

function setState(s) { APP.state = s; DEBUG.state = s; }

const $ = id => document.getElementById(id);
function toast(msg, info) {
  const t = $('toast');
  t.textContent = msg;
  t.className = info ? 'info show' : 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = info ? 'info' : '', 3800);
